    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7d1a1a" />

    <!-- Preconnect to reduce TCP/TLS overhead for first-party API requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preconnect to Render backend — cuts TCP/TLS latency on first API call -->
    <link rel="dns-prefetch" href="https://bodilicious-cxow.onrender.com" />
    <link rel="preconnect" href="https://bodilicious-cxow.onrender.com" crossorigin />

    <!-- Preload the first hero carousel image (LCP element) -->
    <link rel="preload" as="image" href="/assets/hero_carousel_1.webp" fetchpriority="high" />

    <!-- Primary SEO -->

    <title>Bodilicious — Premium Skincare &amp; Haircare</title>
    <meta name="description" content="Shop dermatologically tested skincare and haircare made with science-backed actives like Niacinamide, Retinol &amp; Hyaluronic Acid. Free shipping on orders over ₹1500. Find your perfect routine today." />
    <meta name="keywords" content="skincare, haircare, beauty, organic skincare, dermatologically tested, Bodilicious, serum, shampoo, niacinamide, retinol, hyaluronic acid" />
    <meta name="author" content="Bodilicious" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bodilicious.in/" />
    <!-- Geo + hreflang for Indian local SEO -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <link rel="alternate" hreflang="en-IN" href="https://www.bodilicious.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bodilicious.in/" />
    <meta property="og:title" content="Bodilicious — Premium Skincare &amp; Haircare" />
    <meta property="og:description" content="Shop dermatologically tested skincare and haircare made with science-backed actives. Free shipping on orders over ₹1500." />
    <meta property="og:image" content="https://www.bodilicious.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bodilicious — Premium Skincare &amp; Haircare made in India" />
    <meta property="og:site_name" content="Bodilicious" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.bodilicious.in/" />
    <meta name="twitter:title" content="Bodilicious — Premium Skincare &amp; Haircare" />
    <meta name="twitter:description" content="Shop dermatologically tested skincare and haircare made with science-backed actives. Free shipping on orders over ₹1500." />
    <meta name="twitter:image" content="https://www.bodilicious.in/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bodilicious",
      "url": "https://www.bodilicious.in",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.bodilicious.in/logo.webp"
      },
      "description": "Premium skincare and haircare brand offering dermatologically tested, science-backed beauty products.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

    <!-- JSON-LD: WebSite (enables sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bodilicious",
      "url": "https://www.bodilicious.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.bodilicious.in/shop?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
