    <!-- Preconnect to reduce TCP/TLS overhead for first-party API requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect hints are enough — hardcoded woff2 preload URLs break when
         Google Fonts rotates content-addressed hashes, causing a 404 and a
         "preloaded but not used" warning. The preconnect below keeps the
         DNS/TCP handshake fast without pinning a stale URL. -->
    <!-- Non-blocking Google Fonts load: media=print tricks the browser into treating
         it as non-render-blocking. The onload handler swaps it to media=all once
         the stylesheet is ready, so fonts still apply normally. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
          media="print"
          onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" />
    </noscript>
    <!-- Preconnect to Render backend — cuts TCP/TLS latency on first API call -->
    <link rel="dns-prefetch" href="https://bodilicious-cxow.onrender.com" />
    <link rel="preconnect" href="https://bodilicious-cxow.onrender.com" crossorigin />
    <!-- Preconnect for critical third-party origins to cut DNS/TCP/TLS latency.
         Kept to 4 preconnects total (Lighthouse warns past that, since each one
         costs a connection). apis.google.com is here because Firebase Auth
         blocks the critical path on it; googletagmanager and cloudinary are
         dns-prefetch instead — gtag loads async, and Cloudinary is only hit
         when a page actually renders an admin-uploaded image. -->
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://analytics.ahrefs.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Preload the LCP image for each breakpoint. These MUST stay in sync with
         what HeroCarousel/Logo actually render: the carousel serves the portrait
         hero_mobile_* crop under 768px, so preloading the desktop file there
         would download an image the page never uses. -->
    <link rel="preload" as="image" href="/assets/hero_carousel_1.webp" fetchpriority="high" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/assets/hero_mobile_1.webp" fetchpriority="high" media="(max-width: 767px)" />
    <!-- The navbar logo is the LCP element on mobile — the hero sits lower in
         the mobile layout, so the logo paints first there. -->
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" media="(max-width: 767px)" />

    <!-- Primary SEO -->
