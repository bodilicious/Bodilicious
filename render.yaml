services:
  # ─── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: bodilicious-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /pages/about-us
        destination: /about
      - type: redirect
        source: /pages/brand-story
        destination: /brand-story
      - type: redirect
        source: /pages/contact-us
        destination: /contact
      - type: redirect
        source: /pages/privacy-policy
        destination: /privacy
      - type: redirect
        source: /pages/shipping-and-refund-policy
        destination: /shipping-refund
      - type: redirect
        source: /pages/terms-and-conditions
        destination: /terms
      - type: redirect
        source: /products/matt-liquid-lipstick
        destination: /product/BD-LIP-MATT
      - type: redirect
        source: /products/smooth-hair-banana-shampoo
        destination: /product/BD-SHAM-BANANA
      - type: redirect
        source: /products/spf50-physical-sunscreen
        destination: /product/BD-SUN-PHYS-SPF50
      - type: redirect
        source: /products/beetroot-lip-balm
        destination: /product/BD-LIP-BEET
      - type: redirect
        source: /products/neem-green-tea-extracts-rich-salicylic-acid-serum
        destination: /product/BD-SER-SAL
      - type: redirect
        source: /products/organic-goat-milk-soap
        destination: /product/BD-SOAP-GOAT
      - type: redirect
        source: /products/tnw-antiacne-face-wash
        destination: /product/BD-CLE-ACNE
      - type: redirect
        source: /products/ultimate-uv-defense-sunscreen-lip-balm
        destination: /product/BD-LIP-SUN
      - type: redirect
        source: /products/avobenzone-rich-liquid-sunscreen
        destination: /product/BD-SUN-LIQ
      - type: redirect
        source: /products/azelaic-acid-serum-for-face
        destination: /product/BD-SER-AZE
      - type: redirect
        source: /products/best-organic-herbal-hair-oil-for-hair-growth
        destination: /product/BD-HAIR-OIL-HERB
      - type: redirect
        source: /products/bodilicious-niacinamide-serum
        destination: /product/BD-SER-NIA-SPF30
      - type: redirect
        source: /products/bodilicious-oats-protein-moisturizer
        destination: /product/BD-MOIST-OATS
      - type: redirect
        source: /products/bodilicious-saf-gel
        destination: /product/BD-GEL-SAF
      - type: redirect
        source: /products/carrot-lip-balm
        destination: /product/BD-LIP-CARROT
      - type: redirect
        source: /products/collagen-booster-retinol-night-repair-serum
        destination: /product/BD-SER-RET
      - type: redirect
        source: /products/hair-scalp-growth-promoter
        destination: /product/BD-HAIR-GROWTH
      - type: redirect
        source: /products/hair-serum-for-women-hair-growth
        destination: /product/BD-HAIR-SER
      - type: redirect
        source: /products/keratin-conditioner
        destination: /product/BD-COND-KERATIN
      - type: redirect
        source: /products/ketoconazole-antidandruff-shampoo
        destination: /product/BD-SHAM-DAND
      - type: redirect
        source: /products/kojic-glycolic-infused-facewash
        destination: /product/BD-CLE-KOJIC-GLY
      - type: redirect
        source: /products/organic-olive-oil-soap
        destination: /product/BD-SOAP-OLIVE
      - type: redirect
        source: /products/peptide-ceramide-collagen-complex-moisturizer
        destination: /product/BD-MOIST-PEP
      - type: redirect
        source: /products/rose-face-and-body-wash
        destination: /product/BD-CLE-ROSE
      - type: redirect
        source: /products/scalp-nourishing-baby-hair-growth-serum
        destination: /product/BD-HAIR-BABY
      - type: redirect
        source: /products/skin-brightening-vitamin-c-serum
        destination: /product/BD-SER-VITC
      - type: redirect
        source: /products/strawberry-face-and-body-wash
        destination: /product/BD-CLE-STRAW
      - type: redirect
        source: /collections/*
        destination: /shop
      - type: redirect
        source: /products/*
        destination: /shop
      - type: redirect
        source: /pages/*
        destination: /
      # ── SSG pass-throughs ──────────────────────────────────────────────────
      # These routes have prerendered index.html files written by prerender.js
      # at build time (e.g. dist/product/BD-SER-COQ10/index.html).
      # They must come BEFORE the /* catch-all so Render serves the baked file
      # from the matching directory, not the root SPA shell.
      - type: rewrite
        source: /product/*
        destination: /product/*/index.html
      - type: rewrite
        source: /blogs/*
        destination: /blogs/*/index.html
      - type: rewrite
        source: /blogs
        destination: /blogs/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /brand-story
        destination: /brand-story/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /faqs
        destination: /faqs/index.html
      - type: rewrite
        source: /shipping-refund
        destination: /shipping-refund/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /how-to-order
        destination: /how-to-order/index.html
      - type: rewrite
        source: /ritual-finder
        destination: /ritual-finder/index.html
      - type: rewrite
        source: /shop
        destination: /shop/index.html
      - type: rewrite
        source: /offers
        destination: /offers/index.html
      # ── SPA fallback ─────────────────────────────────────────────────────────
      # Catch-all for any routes without a prerendered file (e.g. /cart, /account)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /*
        name: X-Frame-Options
        value: "SAMEORIGIN"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self';"

      # ── HTML shell — must revalidate so SPA routing always works ─────────────
      - path: /index.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"

      # ── Hashed JS/CSS bundles — content-addressed, safe to cache forever ─────
      - path: /assets/*.js
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/*.css
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

      # ── Images — long cache, serve stale while revalidating ──────────────────
      - path: /assets/*.webp
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /assets/*.png
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /assets/*.jpg
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /assets/*.svg
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /assets/*.gif
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"

      # ── Fonts — very stable, cache for 1 year ────────────────────────────────
      - path: /assets/*.woff2
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/*.woff
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /assets/*.ttf
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

      # ── Video snipets — 7 days cache (bandwidth-heavy, keep cached) ──────────
      - path: /snipets/*.webm
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /snipets/*.mp4
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"

      # ── Product/ingredient pages — short cache (dynamic content) ─────────────
      - path: /products/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /ingredients/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"

    # ── Build-time env vars (baked into the Vite bundle at build time) ───────────
    # These MUST be set in the Render dashboard — the local .env file is NOT used
    # during Render's build step. Without them the frontend points to localhost.
    envVars:
      - key: VITE_API_URL
        sync: false   # set to your backend URL e.g. https://bodilicious-backend.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        sync: false   # set to your LIVE Razorpay key: rzp_live_...

  # ─── Backend (Node Web Service) ─────────────────────────────────────────────
  - type: web
    name: bodilicious-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://bodilicious.in
      - key: RESEND_API_KEY
        sync: false   # set this secret in the Render dashboard
      - key: EMAIL_FROM
        value: "Bodilicious <noreply@bodilicious.in>"
      - key: EMAIL_FROM_SUPPORT
        value: "Bodilicious Support <support@bodilicious.in>"
      - key: EMAIL_FROM_ALERTS
        value: "Bodilicious Alerts <alerts@bodilicious.in>"
      # Signs our own HMAC blobs (checkout quotes, support-upload ownership tags).
      # Kept separate from RAZORPAY_KEY_SECRET so the gateway key can be rotated
      # without invalidating live quotes. Any long random string works.
      # If unset, the app falls back to RAZORPAY_KEY_SECRET and warns at startup.
      - key: APP_SIGNING_SECRET
        sync: false   # set this secret in the Render dashboard
      # Meta app secret used to verify X-Hub-Signature-256 on the WhatsApp
      # webhook. The webhook rejects all traffic until this is set.
      - key: WHATSAPP_APP_SECRET
        sync: false   # set this secret in the Render dashboard
