services:
  # ─── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: bodilicious-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /products/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /ingredients/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /snipets/*.mp4
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"

  # ─── Backend (Node Web Service) ─────────────────────────────────────────────
  - type: web
    name: bodilicious-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.bodilicious.in
      - key: RESEND_API_KEY
        sync: false   # set this secret in the Render dashboard
      - key: EMAIL_FROM
        value: "Bodilicious <noreply@bodilicious.in>"
      - key: EMAIL_FROM_SUPPORT
        value: "Bodilicious Support <support@bodilicious.in>"
      - key: EMAIL_FROM_ALERTS
        value: "Bodilicious Alerts <alerts@bodilicious.in>"
